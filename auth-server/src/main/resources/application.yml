server:
  port: ${AUTH_SERVER_PORT:9000}

spring:
  application:
    name: eshop-auth-server
  thymeleaf:
    cache: false
  flyway:
    enabled: false

# Issuer claim in JWTs. Prefer http://localhost:9000 for local + Compose so the SPA
# and host-run resource server validate the same iss. In Compose, point the resource
# server's jwk-set-uri at http://auth-server:9000/oauth2/jwks while keeping
# AUTH_ISSUER_URI=http://localhost:9000 (or mirror whatever value is set here).
catalog:
  auth:
    issuer-uri: ${AUTH_ISSUER_URI:http://localhost:9000}
    frontend-origin: ${FRONTEND_ORIGIN:http://localhost:4200}
    client-id: ${OAUTH_CLIENT_ID:catalog-spa}
    audience: ${OAUTH_AUDIENCE:catalog-api}
    jwk-path: ${AUTH_JWK_PATH:./data/auth-jwk.json}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

logging:
  level:
    root: INFO
    org.springframework.security: INFO
    com.app.catalog.auth: DEBUG
