# Staging profile: users + OAuth clients in MariaDB (catalog_auth database)
spring:
  datasource:
    url: jdbc:mariadb://mariadb:3306/${AUTH_MARIADB_DATABASE:catalog_auth}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
    username: ${MARIADB_USERNAME:catalog_user}
    password: ${MARIADB_PASSWORD:catalog_pass}
    driver-class-name: org.mariadb.jdbc.Driver
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

logging:
  level:
    com.app.catalog.auth: INFO
