<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>Bookshop Sign In</title>
  <style>
    :root {
      --ink: #1a1a1a;
      --paper: #f7f4ef;
      --accent: #2f5d50;
    }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      font-family: "Segoe UI", sans-serif;
      background: radial-gradient(circle at top left, #e8efe9, var(--paper));
      color: var(--ink);
    }
    form {
      width: min(360px, 92vw);
      padding: 2rem;
      background: rgba(255, 255, 255, 0.9);
      border: 1px solid #d9d2c5;
    }
    h1 { margin: 0 0 0.25rem; font-size: 1.5rem; }
    p { margin: 0 0 1.25rem; color: #555; font-size: 0.95rem; }
    label { display: block; margin: 0.75rem 0 0.25rem; font-size: 0.85rem; }
    input {
      width: 100%;
      box-sizing: border-box;
      padding: 0.65rem 0.75rem;
      border: 1px solid #cfc7b8;
      background: #fff;
    }
    button {
      margin-top: 1.25rem;
      width: 100%;
      padding: 0.75rem;
      border: 0;
      background: var(--accent);
      color: #fff;
      font-weight: 600;
      cursor: pointer;
    }
    .error { color: #a12828; margin-bottom: 0.75rem; }
  </style>
</head>
<body>
<form th:action="@{/login}" method="post">
  <h1>Bookshop</h1>
  <p>Sign in to complete checkout</p>
  <div class="error" th:if="${param.error}">Invalid username or password</div>
  <label for="username">Username</label>
  <input id="username" name="username" type="text" autocomplete="username" required autofocus/>
  <label for="password">Password</label>
  <input id="password" name="password" type="password" autocomplete="current-password" required/>
  <button type="submit">Sign in</button>
</form>
</body>
</html>
