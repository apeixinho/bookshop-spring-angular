spring:
  datasource:
    driver-class-name: org.h2.Driver
    url: jdbc:h2:mem:catalog_db;DATABASE_TO_UPPER=false;IGNORECASE=TRUE;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;
    username: sa
    password:
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        "[default_schema]": catalog_db
  flyway:
    baseline-on-migrate: true
    validate-on-migrate: true
    enabled: true
    locations: classpath:db/migration/h2
  security:
    oauth2:
      resourceserver:
        jwt:
          # Overridden by @MockitoBean JwtDecoder in security tests — avoid live issuer fetch
          issuer-uri: http://localhost:9000
          audiences: catalog-api

app:
  cors:
    allowed-origins: "http://localhost:4200"
