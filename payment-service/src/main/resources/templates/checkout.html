<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Bookshop Payment</title>
  <style>
    :root {
      --bg: #f7f4ef;
      --fg: #1c1917;
      --muted: #78716c;
      --border: #d6d3d1;
      --accent: #0f766e;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100dvh;
      font-family: "Segoe UI", system-ui, sans-serif;
      background: linear-gradient(160deg, #f7f4ef 0%, #e7e5e4 100%);
      color: var(--fg);
      display: grid;
      place-items: center;
      padding: 2rem 1rem;
    }
    .card {
      width: min(28rem, 100%);
      background: #fff;
      border: 1px solid var(--border);
      padding: 2rem;
    }
    h1 {
      margin: 0 0 0.35rem;
      font-size: 1.5rem;
      font-weight: 600;
    }
    .muted { color: var(--muted); font-size: 0.9rem; margin: 0 0 1.5rem; }
    .amount {
      font-size: 1.75rem;
      font-variant-numeric: tabular-nums;
      margin-bottom: 1.5rem;
    }
    label {
      display: grid;
      gap: 0.35rem;
      margin-bottom: 1rem;
      font-size: 0.8rem;
      color: var(--muted);
    }
    input {
      border: 1px solid var(--border);
      padding: 0.65rem 0.75rem;
      font: inherit;
      color: var(--fg);
    }
    .row { display: grid; grid-template-columns: 1fr 1fr; gap: 0.75rem; }
    .actions {
      display: flex;
      gap: 0.75rem;
      margin-top: 1.5rem;
    }
    button {
      flex: 1;
      border: 1px solid var(--border);
      background: #fff;
      padding: 0.75rem 1rem;
      font: inherit;
      cursor: pointer;
    }
    button.pay {
      background: var(--accent);
      border-color: var(--accent);
      color: #fff;
    }
    .badge {
      display: inline-block;
      font-size: 0.7rem;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 0.75rem;
    }
    .terminal { color: #b45309; }
  </style>
</head>
<body>
  <main class="card">
    <p class="badge">Mock payment · Bookshop</p>
    <h1>Complete payment</h1>
    <p class="muted">
      Order <span th:text="${payment.orderTrackingNumber}">tracking</span>
    </p>

    <div class="amount">
      <span th:text="${#numbers.formatDecimal(payment.amount, 1, 2)}">0.00</span>
      <span th:text="${payment.currency}">USD</span>
    </div>

    <div th:if="${payment.status.name() != 'OPEN'}" class="terminal">
      <p th:text="'This session is ' + ${payment.status}">closed</p>
      <p th:if="${payment.failureReason}" th:text="${payment.failureReason}"></p>
    </div>

    <form th:if="${payment.status.name() == 'OPEN'}" th:action="@{|/checkout/${payment.id}/pay|}" method="post">
      <label>
        Card number
        <input name="card" value="4242 4242 4242 4242" autocomplete="off" />
      </label>
      <div class="row">
        <label>
          Expiry
          <input name="expiry" value="12/34" autocomplete="off" />
        </label>
        <label>
          CVC
          <input name="cvc" value="123" autocomplete="off" />
        </label>
      </div>
      <div class="actions">
        <button class="pay" type="submit">Pay now</button>
      </div>
    </form>

    <form th:if="${payment.status.name() == 'OPEN'}" th:action="@{|/checkout/${payment.id}/cancel|}" method="post" style="margin-top: 0.75rem;">
      <div class="actions">
        <button type="submit">Cancel</button>
      </div>
    </form>
  </main>
</body>
</html>
